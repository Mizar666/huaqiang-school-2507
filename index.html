<script>
    let currentStep = 1;
    let globalUser = null;

    window.onload = function() {
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        
        const savedUser = localStorage.getItem('harness_user');
        if (savedUser) {
            globalUser = JSON.parse(savedUser);
            document.getElementById('boot-screen').style.display = 'none';
            showWelcomeAndMain();
        } else {
            document.getElementById('step-1').classList.add('show');
            updateProgress(1);
        }
    };

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function updateProgress(step) {
        const fill = document.getElementById('progress-fill');
        fill.style.width = (step / 5) * 100 + '%'; // 一共5个步骤，修改分母
        const timeStr = '00:00:' + String(step * 8).padStart(2, '0');
        document.getElementById('progress-text').innerText = `REV 0.1.0 · WEB PROFILE ${timeStr}`;
        document.getElementById('step-count').innerText = '0' + step;
    }

    function showStep(step) {
        currentStep = step;
        document.querySelectorAll('.center-content').forEach(el => {
            el.classList.remove('show');
        });
        const targetEl = document.getElementById('step-' + step);
        if (targetEl) {
            targetEl.classList.add('show');
            updateProgress(step);
            console.log("当前步骤：", step);
            if (step === 2) {
                document.getElementById('input-id').focus();
            }
        }
    }

    async function nextStep(step) {
        showStep(step);
        if (step === 3) {
            await sleep(2000);
            showStep(4);
            startCodeStream();
            await sleep(2000);
            showStep(5);
            stopCodeStream();
            await sleep(2500);
            document.getElementById('boot-screen').style.opacity = 0;
            await sleep(1500);
            document.getElementById('boot-screen').style.display = 'none';
            showWelcomeAndMain();
        }
    }
    // 封装sleep，可读性更强
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function verifyAccount() {
        const inputId = document.getElementById('input-id').value.trim();
        const inputName = document.getElementById('input-name').value.trim();
        const errorMsg = document.getElementById('error-msg');
        errorMsg.innerText = '';

        if (!/^\d{8}$/.test(inputId)) { errorMsg.innerText = '错误：身份编号必须为8位纯数字！'; return; }
        const idNum = parseInt(inputId, 10);
        if (idNum < 20200101 || idNum > 20252501) { errorMsg.innerText = '错误：不在允许访问范围 (20200101 ~ 20252501)！'; return; }
        if (inputName === '') { errorMsg.innerText = '错误：身份名称不可为空！'; return; }

        const storedData = localStorage.getItem('harness_account');
        if (storedData) {
            const account = JSON.parse(storedData);
            if (account.id === inputId && account.name === inputName) {
                globalUser = account;
                loginSuccess();
            } else if (account.id === inputId) {
                errorMsg.innerText = '错误：该学号已注册，名字不匹配！';
            } else {
                saveAccountAndLogin(inputId, inputName);
            }
        } else {
            saveAccountAndLogin(inputId, inputName);
        }
    }

    function saveAccountAndLogin(id, name) {
        const newUser = { id: id, name: name };
        localStorage.setItem('harness_account', JSON.stringify(newUser));
        localStorage.setItem('harness_user', JSON.stringify(newUser));
        globalUser = newUser;
        loginSuccess();
    }

    function loginSuccess() {
        playBGM();
        nextStep(3);
    }

    let codeInterval;
    function startCodeStream() {
        const codeEl = document.getElementById('code-stream');
        codeEl.style.opacity = 1;
        codeInterval = setInterval(() => {
            let hex = '';
            for(let i=0; i<8; i++){ hex += Math.floor(Math.random()*255).toString(16).toUpperCase().padStart(2, '0') + ' '; }
            codeEl.innerHTML += hex + '<br>';
            if(codeEl.innerHTML.length > 1000) codeEl.innerHTML = '';
        }, 50);
    }
    function stopCodeStream() {
        clearInterval(codeInterval);
        document.getElementById('code-stream').style.opacity = 0;
    }

    function showWelcomeAndMain() {
        const welcomeOverlay = document.getElementById('welcome-overlay');
        const welcomeText = document.getElementById('welcome-text');
        const mainSite = document.getElementById('main-site');
        const logoutBtn = document.getElementById('logout-btn');

        welcomeText.innerText = `欢迎，${globalUser.name}`;
        welcomeOverlay.style.opacity = 1;
        
        setTimeout(() => {
            welcomeOverlay.style.opacity = 0;
            
            setTimeout(() => {
                welcomeOverlay.style.display = 'none';
                mainSite.style.display = 'block';
                logoutBtn.style.display = 'block';
                
                window.scrollTo(0, 0);
                mainSite.scrollTo(0, 0);

                void mainSite.offsetWidth;
                mainSite.style.opacity = 1;
                
                fadeOutBGM(3);
            }, 1500);
        }, 2500);
    }

    function logout() {
        localStorage.removeItem('harness_user');
        location.reload();
    }

    const bgmAudio = document.getElementById('bgm');
    function playBGM() {
        if (bgmAudio.children.length === 0 && !bgmAudio.src) return;
        bgmAudio.volume = 0.5;
        bgmAudio.play().catch(e => console.log("自动播放被拦截", e));
    }

    function fadeOutBGM(durationSec) {
        if (!bgmAudio.src && bgmAudio.children.length === 0) return;
        const fadeInterval = 50;
        const steps = (durationSec * 1000) / fadeInterval;
        let currentStep = 0;
        const startVolume = bgmAudio.volume;

        const fadeOutTimer = setInterval(() => {
            currentStep++;
            if (currentStep >= steps) {
                clearInterval(fadeOutTimer);
                bgmAudio.pause();
                bgmAudio.currentTime = 0;
            } else {
                bgmAudio.volume = Math.max(0, startVolume - (currentStep / steps) * startVolume);
            }
        }, fadeInterval);
    }

    function handleInputEnter(e) {
        if (e.code === 'Enter') { verifyAccount(); }
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Enter' || e.code === 'Space') {
            if (document.activeElement.tagName === 'INPUT') return;
            if (currentStep === 1) { nextStep(2); }
        }
    });
</script>
