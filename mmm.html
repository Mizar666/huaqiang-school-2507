<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>无人机编队飞行理论刷题</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230099DD'/%3E%3Cg%20stroke='%23fff'%20stroke-width='5'%20stroke-linecap='round'%3E%3Cpath%20d='M18%2022H30M34%2022H46'/%3E%3Cpath%20d='M22%2018V30M22%2034V46'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='5'%20fill='%23fff'/%3E%3C/g%3E%3C/svg%3E" />
<style>
:root{
  --bg:#00005a; --fg:#f2f6ff; --fg-dim:rgba(242,246,255,.72);
  --panel:rgba(255,255,255,.75); --panel-fg:#12224a; --panel-border:rgba(255,255,255,.85);
  --accent:#7fd0ff; --title:#a9ddff;
  --btn-bg:rgba(255,255,255,.85); --btn-fg:#0a2a6b;
  --track:rgba(255,255,255,.28); --fill:#7fd0ff; --fill-fg:#0a2a6b;
  --shadow:rgba(0,0,0,.28); --theme-dot:#7fd0ff;
}
body[data-theme="black"]{
  --bg:#05060a; --fg:#eef2f8; --fg-dim:rgba(238,242,248,.66);
  --panel:rgba(255,255,255,.75); --panel-fg:#10141c; --panel-border:rgba(255,255,255,.9);
  --accent:#7fd0ff; --title:#a9ddff;
  --btn-bg:rgba(255,255,255,.88); --btn-fg:#0c0f14;
  --track:rgba(255,255,255,.24); --fill:#7fd0ff; --fill-fg:#0c0f14;
  --shadow:rgba(0,0,0,.5); --theme-dot:#7fd0ff;
}
body[data-theme="white"]{
  --bg:#ffffff; --fg:#13233c; --fg-dim:rgba(19,35,60,.7);
  --panel:rgba(255,255,255,.78); --panel-fg:#13233c; --panel-border:rgba(9,30,66,.14);
  --accent:#1283c9; --title:#1f8fc4;
  --btn-bg:#eef6ff; --btn-fg:#0b4f85;
  --track:rgba(9,30,66,.14); --fill:#1283c9; --fill-fg:#fff;
  --shadow:rgba(9,30,66,.14); --theme-dot:#1283c9;
}
body[data-theme="navy"]{
  --bg:#00005a; --fg:#f2f6ff; --fg-dim:rgba(242,246,255,.72);
  --panel:rgba(255,255,255,.75); --panel-fg:#12224a; --panel-border:rgba(255,255,255,.85);
  --accent:#7fd0ff; --title:#a9ddff;
  --btn-bg:rgba(255,255,255,.85); --btn-fg:#0a2a6b;
  --track:rgba(255,255,255,.28); --fill:#7fd0ff; --fill-fg:#0a2a6b;
  --shadow:rgba(0,0,0,.3); --theme-dot:#7fd0ff;
}
body[data-theme="gradient"]{
  --bg:linear-gradient(180deg,#0099dd 0%,#000077 60%); --fg:#f2f6ff; --fg-dim:rgba(242,246,255,.78);
  --panel:rgba(255,255,255,.78); --panel-fg:#0e2a55; --panel-border:rgba(255,255,255,.9);
  --accent:#bfe6ff; --title:#d2ecff;
  --btn-bg:rgba(255,255,255,.88); --btn-fg:#0a2a6b;
  --track:rgba(255,255,255,.3); --fill:#bfe6ff; --fill-fg:#0a2a6b;
  --shadow:rgba(0,10,60,.35); --theme-dot:#bfe6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","黑体","SimHei","Heiti SC",Arial,sans-serif;
  background:var(--bg); color:var(--fg);
  overflow:hidden; transition:background .4s ease,color .4s ease;
}
.hidden{display:none!important}

/* ===== 右上角主题切换 ===== */
#themeBar{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:50}
.theme-btn{padding:11px 16px;min-height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);color:var(--fg);font-size:13px;cursor:pointer;font-family:inherit;transition:.25s;display:flex;align-items:center;gap:6px}
.theme-btn i{width:10px;height:10px;border-radius:50%;background:var(--theme-dot);display:inline-block}
.theme-btn:hover{background:rgba(255,255,255,.22)}
.theme-btn.active{background:var(--accent);color:var(--fill-fg);border-color:var(--accent);font-weight:700}

/* ===== 开始页 ===== */
#startScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:52px;text-align:center;padding:24px}
#mainTitle{font-size:36pt;font-weight:700;color:var(--title);letter-spacing:6px;text-shadow:0 4px 18px var(--shadow);
  animation:dropFade 3s ease-out both}
@keyframes dropFade{
  0%{opacity:0;transform:translateY(-160px)}
  100%{opacity:1;transform:translateY(0)}
}
#startBtn{font-size:20px;padding:16px 56px;border:none;border-radius:16px;cursor:pointer;
  background:var(--btn-bg);color:var(--btn-fg);font-family:inherit;font-weight:700;
  box-shadow:0 10px 30px var(--shadow);transition:.25s;letter-spacing:2px}
#startBtn:hover{transform:translateY(-3px);box-shadow:0 16px 38px var(--shadow)}
#startHint{font-size:14px;color:var(--fg-dim);letter-spacing:1px}

/* ===== 答题页 ===== */
#quizScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px 110px}
#qMeta{font-size:14px;color:var(--fg-dim);margin-bottom:12px;letter-spacing:1px;display:flex;align-items:center;gap:10px}
#qType{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--fill-fg);font-weight:600}
#qStem{font-size:24px;line-height:1.55;max-width:920px;text-align:center;font-weight:600;margin-bottom:34px}
#qOptions{display:flex;flex-direction:column;gap:16px;width:min(760px,92vw)}
.opt{display:flex;align-items:center;width:100%;text-align:left;padding:15px 20px;border-radius:14px;cursor:pointer;
  background:var(--panel);color:var(--panel-fg);border:2px solid transparent;
  font-family:"黑体","SimHei","Heiti SC",Arial,sans-serif;font-size:17px;line-height:1.5;transition:.18s}
.opt:hover{transform:translateX(4px);box-shadow:0 8px 22px var(--shadow)}
.opt .key{display:inline-flex;width:30px;height:30px;border-radius:8px;align-items:center;justify-content:center;
  background:rgba(0,0,0,.07);margin-right:14px;font-weight:700;font-family:Arial,sans-serif;flex:none}
.opt.sel{border-color:var(--accent);background:rgba(255,255,255,.94);box-shadow:0 6px 20px var(--shadow)}
.opt.sel .key{background:var(--accent);color:var(--fill-fg)}

/* ===== 底部栏：上一题 / 进度 / 下一题 ===== */
#bottomBar{position:fixed;left:0;right:0;bottom:0;height:96px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 26px;gap:10px;z-index:40}
.nav-btn{font-size:15px;padding:12px 28px;border:none;border-radius:12px;cursor:pointer;
  background:var(--btn-bg);color:var(--btn-fg);font-family:inherit;font-weight:600;transition:.25s;box-shadow:0 6px 18px var(--shadow);letter-spacing:1px}
.nav-btn:hover{transform:translateY(-2px)}
.nav-btn.hidden{visibility:hidden;pointer-events:none}
#prevBtn{justify-self:start}
#nextBtn{justify-self:end;background:var(--accent);color:var(--fill-fg)}
#progressArea{display:flex;align-items:center;gap:14px;justify-content:center}
#progressTrack{width:min(300px,26vw);height:10px;border-radius:999px;background:var(--track);overflow:hidden}
#progressFill{height:100%;width:0%;border-radius:999px;background:var(--fill);transition:width .4s ease}
#progressText{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:150px;text-align:center}

/* ===== 结果页 ===== */
#resultScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#scoreRing{width:230px;height:230px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--panel);box-shadow:0 18px 60px var(--shadow);border:6px solid var(--accent)}
#scoreNum{font-size:66px;font-weight:800;color:var(--panel-fg);line-height:1}
#scoreLabel{font-size:15px;color:var(--panel-fg);opacity:.75;margin-top:8px;letter-spacing:2px}
#stats{display:flex;gap:48px;margin-top:6px}
.stat{text-align:center}
.stat b{display:block;font-size:32px;line-height:1.2}
.stat span{font-size:14px;color:var(--fg-dim);letter-spacing:1px}
.stat.correct b{color:#2bd47c}
.stat.wrong b{color:#ff7a6b}
#restartBtn{font-size:16px;padding:13px 44px;border:none;border-radius:14px;cursor:pointer;margin-top:10px;
  background:var(--btn-bg);color:var(--btn-fg);font-family:inherit;font-weight:700;box-shadow:0 10px 30px var(--shadow);transition:.25s;letter-spacing:2px}
#restartBtn:hover{transform:translateY(-2px)}

/* ===== 响应式 ===== */
@media (max-width:760px){
  #mainTitle{font-size:28pt;letter-spacing:3px}
  #qStem{font-size:19px;margin-bottom:24px}
  .opt{font-size:15px;padding:13px 16px}
  #bottomBar{padding:0 14px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;height:118px;row-gap:6px}
  #progressArea{grid-column:1/3;grid-row:1;order:-1;min-width:0}
  #progressTrack{width:min(300px,58vw)}
  #prevBtn{grid-column:1;grid-row:2}
  #nextBtn{grid-column:2;grid-row:2;justify-self:end}
  #quizScreen{padding-bottom:140px}
  #scoreNum{font-size:52px}
  #scoreRing{width:190px;height:190px}
}
</style>
</head>
<body data-theme="navy">

<!-- ===== 右上角主题切换 ===== -->
<div id="themeBar">
  <button class="theme-btn" data-theme="black"><i></i>黑</button>
  <button class="theme-btn" data-theme="white"><i></i>白</button>
  <button class="theme-btn" data-theme="navy"><i></i>深蓝</button>
  <button class="theme-btn" data-theme="gradient"><i></i>渐变</button>
</div>

<!-- ===== 开始页 ===== -->
<div id="startScreen">
  <h1 id="mainTitle">空白</h1>
  <button id="startBtn">开始答题</button>
  <p id="startHint">共 500 题 · 单选 / 多选 / 判断 · 满分 100 分</p>
</div>

<!-- ===== 答题页 ===== -->
<div id="quizScreen" class="hidden">
  <div id="qMeta"><span id="qType"></span><span id="qNum"></span></div>
  <div id="qStem"></div>
  <div id="qOptions"></div>
  <div id="bottomBar">
    <button id="prevBtn" class="nav-btn hidden">上一题</button>
    <div id="progressArea">
      <div id="progressTrack"><div id="progressFill"></div></div>
      <span id="progressText">1 / 500 · 0%</span>
    </div>
    <button id="nextBtn" class="nav-btn hidden">下一题</button>
  </div>
</div>

<!-- ===== 结果页 ===== -->
<div id="resultScreen" class="hidden">
  <div id="scoreRing">
    <div id="scoreNum">0</div>
    <div id="scoreLabel">得分 / 满分 100</div>
  </div>
  <div id="stats">
    <div class="stat correct"><b id="statCorrect">0</b><span>答对题数</span></div>
    <div class="stat wrong"><b id="statWrong">0</b><span>答错题数</span></div>
  </div>
  <button id="restartBtn">重新开始</button>
</div>

<script type="application/json" id="questionData">[{"id":1,"type":"单选题","stem":"执行群飞任务时，发现同组人员为赶进度建议跳过飞前检查。作为操作者，最符合职业道德的做法是？","options":[{"key":"A","text":"等出现异常后再处理"},{"key":"B","text":"只检查电量后起飞"},{"key":"C","text":"听从同组人员直接起飞"},{"key":"D","text":"坚持按程序完成飞前检查并报告风险"}],"answer":"D","answerText":"坚持按程序完成飞前检查并报告风险"},{"id":2,"type":"单选题","stem":"整理飞行日志时发现一项关键数据缺失，最符合诚实守信要求的做法是？","options":[{"key":"A","text":"如实记录缺失情况并按流程补充核查"},{"key":"B","text":"自行估算一个数值补齐"},{"key":"C","text":"删除相关异常记录"},{"key":"D","text":"将缺失数据标为正常"}],"answer":"A","answerText":"如实记录缺失情况并按流程补充核查"},{"id":3,"type":"单选题","stem":"多人协同部署编队设备时，出现职责交叉。最合适的处理方式是？","options":[{"key":"A","text":"各自按个人习惯操作"},{"key":"B","text":"及时沟通确认分工和接口，按统一流程协作"},{"key":"C","text":"只关注自己设备，不管整体任务"},{"key":"D","text":"相互等待直至比赛结束"}],"answer":"B","answerText":"及时沟通确认分工和接口，按统一流程协作"},{"id":4,"type":"单选题","stem":"发现自己的操作可能导致任务结果不可靠，但尚未发生事故。最恰当的做法是？","options":[{"key":"A","text":"立即说明情况，停止相关操作并按流程复核"},{"key":"B","text":"修改日志使结果看起来正常"},{"key":"C","text":"隐瞒问题，等任务结束再说"},{"key":"D","text":"继续执行以避免影响进度"}],"answer":"A","answerText":"立即说明情况，停止相关操作并按流程复核"},{"id":5,"type":"单选题","stem":"在竞赛或工作中使用未经授权的他人任务文件，主要违背了哪项职业要求？","options":[{"key":"A","text":"团队协作"},{"key":"B","text":"环境保护"},{"key":"C","text":"诚实守信"},{"key":"D","text":"提高效率"}],"answer":"C","answerText":"诚实守信"},{"id":6,"type":"单选题","stem":"面对设备异常，操作者无法确认故障原因时，最恰当的职业行为是？","options":[{"key":"A","text":"继续用于正式任务观察效果"},{"key":"B","text":"按规程隔离异常设备并向有权限人员报告"},{"key":"C","text":"反复强制启动直到成功"},{"key":"D","text":"擅自拆改关键安全部件"}],"answer":"B","answerText":"按规程隔离异常设备并向有权限人员报告"},{"id":7,"type":"单选题","stem":"对飞行计划中存在的已知风险进行记录和交接，最直接体现了哪项职业要求？","options":[{"key":"A","text":"认真负责"},{"key":"B","text":"追求速度"},{"key":"C","text":"减少沟通"},{"key":"D","text":"降低记录量"}],"answer":"A","answerText":"认真负责"},{"id":8,"type":"单选题","stem":"接班人员询问上一阶段出现的间歇性通信异常，正确做法是？","options":[{"key":"A","text":"隐去尚未定位的风险"},{"key":"B","text":"完整说明异常现象、处置过程和当前状态"},{"key":"C","text":"让接班人员自己从头排查"},{"key":"D","text":"只说“已经没事”"}],"answer": 增加"},{"key":"D","text":"推力方向或力矩配置异常，影响正常起飞"}],"answer":"D","answerText":"推力方向或力矩配置异常，影响正常起飞"},{"id":66,"type":"单选题","stem":"锂电池容量常用什么单位表示？","options":[{"key":"A","text":"N·m"},{"key":"B","text":"mAh或Ah"},{"key":"C","text":"dB"},{"key":"D","text":"Hz"}],"answer":"B","answerText":"mAh或Ah"},{"id":67,"type":"单选题","stem":"同等电压下，电池容量增大通常意味着？","options":[{"key":"A","text":"一定使飞行速度翻倍"},{"key":"B","text":"理论可提供的电量增加，但重量等因素也可能增加"},{"key":"C","text":"一定不会增加重量"},{"key":"D","text":"一定使定位精度提高"}],"answer":"B","answerText":"理论可提供的电量增加，但重量等因素也可能增加"},{"id":68,"type":"单选题","stem":"对多旋翼群飞影响较直接的气象因素之一是？","options":[{"key":"A","text":"场地坡度"},{"key":"B","text":"风速和阵风"},{"key":"C","text":"无人机编号顺序"},{"key":"D","text":"任务文件压缩格式"}],"answer":"B","answerText":"风速和阵风"},{"id":69,"type":"单选题","stem":"阵风相比稳定风更容易引起什么问题？","options":[{"key":"A","text":"电池容量瞬间增加"},{"key":"B","text":"任务文件自动缩小"},{"key":"C","text":"GNSS卫星数量固定增加"},{"key":"D","text":"短时间姿态和位置扰动增大"}],"answer":"D","answerText":"短时间姿态和位置扰动增大"},{"id":70,"type":"单选题","stem":"高温环境可能对无人机运行造成的影响是？","options":[{"key":"A","text":"空气密度一定增大"},{"key":"B","text":"电池和电子设备散热压力增大"},{"key":"C","text":"通信必然完全中断"},{"key":"D","text":"推力一定无限增加"}],"answer":"B","answerText":"电池和电子设备散热压力增大"},{"id":71,"type":"单选题","stem":"低温环境下锂电池常见的性能变化是？","options":[{"key":"A","text":"内阻必然降为零"},{"key":"B","text":"可用容量和放电能力下降"},{"key":"C","text":"不受温度影响"},{"key":"D","text":"容量必然翻倍"}],"answer":"B","answerText":"可用容量和放电能力下降"},{"id":72,"type":"单选题","stem":"无线通信链路中，“有害干扰”最可能造成？","options":[{"key":"A","text":"螺旋桨变长"},{"key":"B","text":"电池自动充满"},{"key":"C","text":"通信质量下降甚至链路中断"},{"key":"D","text":"机架重量减小"}],"answer":"C","answerText":"通信质量下降甚至链路中断"},{"id":73,"type":"单选题","stem":"在同一频段内增加大量同时发射的设备而缺乏规划，最可能导致？","options":[{"key":"A","text":"飞行边界自动扩大"},{"key":"B","text":"电池温度自动下降"},{"key":"C","text":"所有设备定位精度必然提高"},{"key":"D","text":"信道拥塞和相互干扰风险增大"}],"answer":"D","answerText":"信道拥塞和相互干扰风险增大"},{"id":74,"type":"单选题","stem":"通信链路的“延迟”主要描述？","options":[{"key":"A","text":"信息从发送到接收所需的时间"},{"key":" ns":[{"key":"A","text":"随机修改编号"},{"key":"B","text":"确认数据格式、坐标、时序和约束均有效"},{"key":"C","text":"删除所有安全限制"},{"key":"D","text":"关闭仿真"}],"answer":"B","answerText":"确认数据格式、坐标、时序和约束均有效"},{"id":144,"type":"单选题","stem":"任务程序中的无人机编号与实际设备映射错误，最可能导致？","options":[{"key":"A","text":"地面站自动断电"},{"key":"B","text":"风速改变"},{"key":"C","text":"无人机执行了不属于自己的轨迹或任务"},{"key":"D","text":"所有无人机电量增加"}],"answer":"C","answerText":"无人机执行了不属于自己的轨迹或任务"},{"id":145,"type":"单选题","stem":"正式飞行前进行三维仿真的主要目的之一是？","options":[{"key":"A","text":"修改空域法规"},{"key":"B","text":"替代所有实飞检查"},{"key":"C","text":"增加电池容量"},{"key":"D","text":"预先验证轨迹、时序和空间冲突"}],"answer":"D","answerText":"预先验证轨迹、时序和空间冲突"},{"id":146,"type":"单选题","stem":"仿真结果显示某机在转弯处明显超过速度上限，最合理的处理是？","options":[{"key":"A","text":"关闭速度检测"},{"key":"B","text":"只修改灯光"},{"key":"C","text":"修改轨迹或时序后重新仿真校验"},{"key":"D","text":"忽略仿真直接实飞"}],"answer":"C","answerText":"修改轨迹或时序后重新仿真校验"},{"id":147,"type":"单选题","stem":"任务安全校验应在什么时候完成？","options":[{"key":"A","text":"飞行结束后才第一次做"},{"key":"B","text":"程序提交或实飞前"},{"key":"C","text":"出现碰撞后再做"},{"key":"D","text":"设备回库后再做"}],"answer":"B","answerText":"程序提交或实飞前"},{"id":148,"type":"单选题","stem":"若碰撞检测通过，但飞行边界检测失败，任务是否可直接执行？","options":[{"key":"A","text":"可以，只要电量充足"},{"key":"B","text":"不可以，还需修正边界问题并重新校验"},{"key":"C","text":"可以，因为无碰撞即可"},{"key":"D","text":"可以，只要灯光正确"}],"answer":"B","answerText":"不可以，还需修正边界问题并重新校验"},{"id":149,"type":"单选题","stem":"在同一时刻，两架无人机坐标分别为(0,0,0)和(0.6,0.8,0)（单位：米）。忽略定位误差，其空间距离约为？","options":[{"key":"A","text":"0.7米"},{"key":"B","text":"2米"},{"key":"C","text":"1.5米"},{"key":"D","text":"1米"}],"answer":"D","answerText":"1米"},{"id":150,"type":"单选题","stem":"群飞规划规定两机最小安全间距为0.8米。若两架无人机的定位误差在最不利方向上各可能达到0.1米，为保留这部分误差裕度，名义规划间距至少应约为？","options":[{"key":"A","text":"1.0米"},{"key":"B","text":"0.8米"},{"key":"C","text":"0.7米"},{"key":"D","text":"0.6米"}],"answer":"A","answerText":"1.0米"},{"id":151,"type":"单选题","stem":"两架无人机的起点和终点均满足安全间距，但两条轨迹在同一时刻经过同一中间区域。正确的安全判断是？","options":[{"key":"A","text":"只要起点安全即可"},{"key":"B","text":"仍存在冲突风险，应检查全程的时空最小间距"},{"key":"C","text":"只要终点安全即可"},{"key":"D","text":"只需比较两条轨迹的总长度"}],"answer":"B","answerText":"仍存在冲突风险，应检查全程的时空最小间距"},{"id":152,"type":"单选题","stem":"将编队中所有点的坐标同时加上同一个平移向量，且不进行旋转和缩放。编队内部各点的相对距离将？","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"全部变为原来的2倍"},{"key":"C","text":"全部变为0"},{"key":"D","text":"由灯光颜色决定"}],"answer":"A","answerText":"保持不变"},{"id":153,"type":"单选题","stem":"俯视图中两架无人机的水平坐标重合，但两机高度不同。判断两机是否构成碰撞风险时，最合理的做法是？","options":[{"key":"A","text":"仅凭俯视图认定一定碰撞"},{"key":"B","text":"只比较两机编号"},{"key":"C","text":"结合垂直间距、同步时刻及安全阈值进行三维判断"},{"key":"D","text":"只比较灯光状态"}],"answer":"C","answerText":"结合垂直间距、同步时刻及安全阈值进行三维判断"},{"id":154,"type":"单选题","stem":"两架无人机的几何路径在空间中交叉，但它们通过交叉点的时间窗口完全不重叠。判断是否构成同时冲突时，正确做法是？","options":[{"key":"A","text":"只要几何路径交叉就一定发生碰撞"},{"key":"B","text":"应结合通过时刻判断；时间窗口不重叠时不一定构成同时冲突"},{"key":"C","text":"只比较两机编号大小"},{"key":"D","text":"必须删除其中一条完整路径"}],"answer":"B","answerText":"应结合通过时刻判断；时间窗口不重叠时不一定构成同时冲突"},{"id":155,"type":"单选题","stem":"某段轨迹长度约20米，规划用时10秒，若近似匀速，其平均速度约为？","options":[{"key":"A","text":"3.2米/秒"},{"key":"B","text":"2.5米/秒"},{"key":"C","text":"2米/秒"},{"key":"D","text":"1.5米/秒"}],"answer":"C","answerText":"2米/秒"},{"id":156,"type":"单选题","stem":"某段轨迹的全程平均速度低于任务规定的速度上限。能否据此直接认定整段轨迹不存在速度超限？","options":[{"key":"A","text":"不能，还需检查各时刻或各分段的瞬时/局部速度"},{"key":"B","text":"可以，平均速度合格即可"},{"key":"C","text":"可以，只要起飞速度合格"},{"key":"D","text":"可以，只要降落速度合格"}],"answer":"A","answerText":"不能，还需检查各时刻或各分段的瞬时/局部速度"},{"id":157,"type":"单选题","stem":"同一条30米路径，计划用时由20秒缩短为15秒。忽略其他因素，所需平均速度将？","options":[{"key":"A","text":"降低"},{"key":"B","text":"由1.5m/s提高到2.0m/s"},{"key":"C","text":"保持1.5m/s不变"},{"key":"D","text":"无法由路径和时间判断"}],"answer":"B","answerText":"由1.5m/s提高到2.0m/s"},{"id":158,"type":"单选题","stem":"轨迹中存在尖锐转角。若在不突破空间边界的前提下对转角进行平滑处理，通常有助于？","options":[{"key":"A","text":"降低方向突变带来的峰值加速度需求，提高可跟踪性"},{"key":"B","text":"消除全部定位误差"},{"key":"C","text":"使所有无人机必须以最大速度飞行"},{"key":"D","text":"取消碰撞检测"}],"answer":"A","answerText":"降低方向突变带来的峰值加速度需求，提高可跟踪性"},{"id":159,"type":"单选题","stem":"对群飞轨迹进行速度合规检查时，以下做法最合理的是？","options":[{"key":"A","text":"只看任务总时长"},{"key":"B","text":"只看起飞阶段"},{"key":"C","text":"沿时间轴或轨迹分段检查速度峰值及持续情况"},{"key":"D","text":"只比较不同无人机的灯光颜色"}],"answer":"C","answerText":"沿时间轴或轨迹分段检查速度峰值及持续情况"},{"id":160,"type":"单选题","stem":"4组无人机依次起飞，相邻两组起飞时间相差0.5秒，第1组在0秒起飞，则第4组约在第几秒起飞？","options":[{"key":"A","text":"2秒"},{"key":"B","text":"2.5秒"},{"key":"C","text":"1秒"},{"key":"D","text":"1.5秒"}],"answer":"D","answerText":"1.5秒"},{"id":161,"type":"单选题","stem":"某队形变换要求“所有无人机到达目标点并稳定后，才进入下一阶段”。最合适的时序设计思路是？","options":[{"key":"A","text":"将目标状态满足作为阶段切换条件"},{"key":"B","text":"无论状态如何固定1秒后切换"},{"key":"C","text":"各机自行随机决定切换时间"},{"key":"D","text":"只按灯光颜色切换"}],"answer":"A","answerText":"将目标状态满足作为阶段切换条件"},{"id":162,"type":"单选题","stem":"多机任务中，各无人机的时间基准逐渐产生漂移，最可能直接造成的影响是？","options":[{"key":"A","text":"电池容量永久增加"},{"key":"B","text":"队形动作或灯光事件出现不同步"},{"key":"C","text":"机架尺寸发生变化"},{"key":"D","text":"飞行区域自动扩大"}],"answer":"B","answerText":"队形动作或灯光事件出现不同步"},{"id":163,"type":"单选题","stem":"两个任务阶段允许部分重叠执行。估算总任务时长时，正确方法是？","options":[{"key":"A","text":"根据阶段依赖关系和实际重叠区间计算，不能简单相加"},{"key":"B","text":"直接把两个阶段时长相加"},{"key":"C","text":"只取较短阶段时长"},{"key":"D","text":"忽略阶段先后关系"}],"answer":"A","answerText":"根据阶段依赖关系和实际重叠区间计算，不能简单相加"},{"id":164,"type":"单选题","stem":"在一个对同步精度要求较高的关键队形切换前预留少量时间缓冲，主要作用是？","options":[{"key":"A","text":"提高灯光亮度"},{"key":"B","text":"吸收前序执行偏差和通信/控制延迟，提升时序鲁棒性"},{"key":"C","text":"增大文件体积"},{"key":"D","text":"取消状态校验"}],"answer":"B","answerText":"吸收前序执行偏差和通信/控制延迟，提升时序鲁棒性"},{"id":165,"type":"单选题","stem":"将队形中点(2,3,4)（单位：米）相对原点按比例2等比缩放，新坐标应为？","options":[{"key":"A","text":"(5,7,9)"},{"key":"B","text":"(1.0,1.5,2.0)"},{"key":"C","text":"(4,5,6)"},{"key":"D","text":"(4,6,8)"}],"answer":"D","answerText":"(4,6,8)"},{"id":166,"type":"单选题","stem":"将整个三维队形沿X、Y、Z方向分别平移相同的固定偏移量后，队形的形状和各点间相对距离将？","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"按偏移量成比例放大"},{"key":"C","text":"全部缩小一半"},{"key":"D","text":"随机变化"}],"answer":"A","answerText":"保持不变"},{"id":167,"type":"单选题","stem":"将一个三维队形以原点为中心按1.5倍等比例缩放，任意两点之间的距离将？","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"变为原来的1.5倍"},{"key":"C","text":"变为原来的2.25倍"},{"key":"D","text":"只改变高度，不改变水平距离"}],"answer":"B","answerText":"变为原来的1.5倍"},{"id":168,"type":"单选题","stem":"某建模文件中的坐标单位实际为厘米，但导入任务系统时被错误当作米。若未做单位转换，最可能造成的结果是？","options":[{"key":"A","text":"队形尺度缩小100倍"},{"key":"B","text":"只影响灯光，不影响轨迹"},{"key":"C","text":"队形尺度放大约100倍"},{"key":"D","text":"只改变无人机编号"}],"answer":"C","answerText":"队形尺度放大约100倍"},{"id":169,"type":"单选题","stem":"多机路径规划与单机路径规划相比，新增的核心问题之一是？","options":[{"key":"A","text":"需要同时考虑多架无人机之间的相互冲突"},{"key":"B","text":"不需要考虑空间边界"},{"key":"C","text":"不需要考虑时间"},{"key":"D","text":"只需要考虑一架无人机的电量"}],"answer":"A","answerText":"需要同时考虑多架无人机之间的相互冲突"},{"id":170,"type":"单选题","stem":"为多架无人机规划路径时，仅让每条单机路径都避开固定障碍物是否足够？","options":[{"key":"A","text":"不够，还要检查不同无人机路径的时空冲突"},{"key":"B","text":"足够，只要速度相同"},{"key":"C","text":"足够，只要终点不同"},{"key":"D","text":"足够，因为障碍物是唯一风险"}],"answer":"A","answerText":"不够，还要检查不同无人机路径的时空冲突"},{"id":171,"type":"单选题","stem":"设置最小机间安全距离的直接目的是？","options":[{"key":"A","text":"提高灯光亮度"},{"key":"B","text":"降低无人机之间发生碰撞的风险"},{"key":"C","text":"改变网络拓扑"},{"key":"D","text":"缩短文件名"}],"answer":"B","answerText":"降低无人机之间发生碰撞的风险"},{"id":172,"type":"单选题","stem":"定位误差增大时，合理的路径规划调整通常是？","options":[{"key":"A","text":"减小安全距离"},{"key":"B","text":"提高最大速度"},{"key":"C","text":"取消边界检查"},{"key":"D","text":"增大安全距离裕度"}],"answer":"D","answerText":"增大安全距离裕度"},{"id":173,"type":"单选题","stem":"将场地允许飞行范围建模为三维边界，主要用于？","options":[{"key":"A","text":"计算电池循环次数"},{"key":"B","text":"选择文件格式"},{"key":"C","text":"约束轨迹不得越出允许空间"},{"key":"D","text":"管理人员账号"}],"answer":"C","answerText":"约束轨迹不得越出允许空间"},{"id":174,"type":"单选题","stem":"固定障碍物在路径规划中通常应被建模为？","options":[{"key":"A","text":"任务颜色"},{"key":"B","text":"电量阈值"},{"key":"C","text":"网络端口"},{"key":"D","text":"不可穿越或需保持安全裕度的禁入区域"}],"answer":"D","answerText":"不可穿越或需保持安全裕度的禁入区域"},{"id":175,"type":"单选题","stem":"任务书规定最高飞行高度，路径规划应？","options":[{"key":"A","text":"用灯光代替高度检查"},{"key":"B","text":"忽略高度限制"},{"key":"C","text":"将其作为硬约束或安全限制纳入校验"},{"key":"D","text":"只在飞行后记录"}],"answer":"C","answerText":"将其作为硬约束或安全限制纳入校验"},{"id":176,"type":"单选题","stem":"若一段路径要求的速度超过设备允许上限，应优先？","options":[{"key":"A","text":"提高灯光亮度"},{"key":"B","text":"关闭速度检测"},{"key":"C","text":"继续执行并依赖现场修正"},{"key":"D","text":"调整路径长度或执行时间，使速度回到允许范围"}],"answer":"D","answerText":"调整路径长度或执行时间，使速度回到允许范围"},{"id":177,"type":"单选题","stem":"两条几何路径相交时，最常见的无冲突处理方式之一是？","options":[{"key":"A","text":"缩小安全距离"},{"key":"B","text":"错开通过交叉区域的时间"},{"key":"C","text":"让两机同时加速"},{"key":"D","text":"关闭定位"}],"answer":"B","answerText":"错开通过交叉区域的时间"},{"id":178,"type":"单选题","stem":"判断两架无人机是否发生动态冲突，需要重点比较？","options":[{"key":"A","text":"同一时刻的空间距离"},{"key":"B","text":"地面站分辨率"},{"key":"C","text":"机身颜色"},{"key":"D","text":"各自文件大小"}],"answer":"A","answerText":"同一时刻的空间距离"},{"id":179,"type":"单选题","stem":"仅比较两条轨迹在二维平面上的投影可能产生什么问题？","options":[{"key":"A","text":"无法读取日志"},{"key":"B","text":"无法显示颜色"},{"key":"C","text":"无法计算电量"},{"key":"D","text":"忽略高度差，导致对三维冲突的误判"}],"answer":"D","answerText":"忽略高度差，导致对三维冲突的误判"},{"id":180,"type":"单选题","stem":"发现两机预计在某时刻小于最小安全间距，下列优先做法是？","options":[{"key":"A","text":"忽略少量超限"},{"key":"B","text":"关闭碰撞告警"},{"key":"C","text":"调整其中一机或两机的路径/时序并重新校验"},{"key":"D","text":"降低安全距离阈值"}],"answer":"C","answerText":"调整其中一机或两机的路径/时序并重新校验"},{"id":181,"type":"单选题","stem":"若空间可绕行但会显著增加航程，另一种可选的避碰策略是？","options":[{"key":"A","text":"让两机使用相同轨迹同一时刻通过"},{"key":"B","text":"随机选择无人机"},{"key":"C","text":"取消高度限制"},{"key":"D","text":"通过时间调度错峰经过冲突区域"}],"answer":"D","answerText":"通过时间调度错峰经过冲突区域"},{"id":182,"type":"单选题","stem":"路径优化中的“路径长度更短”通常有助于？","options":[{"key":"A","text":"减少飞行距离和潜在能耗"},{"key":"B","text":"必然提高电池电压"},{"key":"C","text":"必然提高定位精度"},{"key":"D","text":"必然消除所有冲突"}],"answer":"A","answerText":"减少飞行距离和潜在能耗"},{"id":183,"type":"单选题","stem":"路径最短但紧贴障碍物边界，与稍长但安全裕度大的路径相比，通常应？","options":[{"key":"A","text":"综合安全裕度和可执行性选择，不只追求最短"},{"key":"B","text":"无条件选择速度最大"},{"key":"C","text":"只看灯光效果"},{"key":"D","text":"无条件选择最短"}],"answer":"A","answerText":"综合安全裕度和可执行性选择，不只追求最短"},{"id":184,"type":"单选题","stem":"对大量无人机规划时，希望降低总航程，同时保持机间安全，属于？","options":[{"key":"A","text":"单纯图像处理问题"},{"key":"B","text":"带约束的多目标/组合优化问题"},{"key":"C","text":"电池化学问题"},{"key":"D","text":"机械装配问题"}],"answer":"B","answerText":"带约束的多目标/组合优化问题"},{"id":185,"type":"单选题","stem":"某些目标点距离不同起飞点差异明显，为减少总飞行距离可优先优化？","options":[{"key":"A","text":"起点与目标点的分配关系"},{"key":"B","text":"无线网名称"},{"key":"C","text":"灯光颜色"},{"key":"D","text":"日志文件夹"}],"answer":"A","answerText":"起点与目标点的分配关系"},{"id":186,"type":"单选题","stem":"路径由一系列离散位置点描述时，这些点通常称为？","options":[{"key":"A","text":"电池点"},{"key":"B","text":"像素点"},{"key":"C","text":"航路点/航点"},{"key":"D","text":"网关点"}],"answer":"C","answerText":"航路点/航点"},{"id":187,"type":"单选题","stem":"航点间距离过大且中间有障碍物时，仅检查航点本身可能？","options":[{"key":"A","text":"使日志丢失"},{"key":"B","text":"改变机头编号"},{"key":"C","text":"漏检航段与障碍物相交"},{"key":"D","text":"导致电池充电"}],"answer":"C","answerText":"漏检航段与障碍物相交"},{"id":188,"type":"单选题","stem":"路径中出现尖锐转角，通常需要关注？","options":[{"key":"A","text":"文件图标"},{"key":"B","text":"网络密码长度"},{"key":"C","text":"电池标签"},{"key":"D","text":"速度方向和加速度能否平滑变化"}],"answer":"D","answerText":"速度方向和加速度能否平滑变化"},{"id":189,"type":"单选题","stem":"对同一段轨迹降低执行速度，通常会使该段执行时间？","options":[{"key":"A","text":"减少"},{"key":"B","text":"与速度完全无关"},{"key":"C","text":"变为零"},{"key":"D","text":"增加"}],"answer":"D","answerText":"增加"},{"id":190,"type":"单选题","stem":"在同一水平位置通过不同高度层实现机间分离，属于？","options":[{"key":"A","text":"空间分层避碰"},{"key":"B","text":"网络分段"},{"key":"C","text":"电池均衡"},{"key":"D","text":"时间同步"}],"answer":"A","answerText":"空间分层避碰"},{"id":191,"type":"单选题","stem":"高度分层避碰仍需检查什么？","options":[{"key":"A","text":"只需看最终高度层"},{"key":"B","text":"无需再检查"},{"key":"C","text":"只需看起点"},{"key":"D","text":"爬升/下降过渡阶段是否产生新的冲突"}],"answer":"D","answerText":"爬升/下降过渡阶段是否产生新的冲突"},{"id":192,"type":"单选题","stem":"轨迹上的任何一点越出允许飞行边界，说明？","options":[{"key":"A","text":"电池异常"},{"key":"B","text":"通信一定中断"},{"key":"C","text":"路径边界校验不通过"},{"key":"D","text":"任务必然完成"}],"answer":"C","answerText":"路径边界校验不通过"},{"id":193,"type":"单选题","stem":"安全边界向内收缩一定距离形成“缓冲区”的主要目的？","options":[{"key":"A","text":"为定位误差、控制误差等不确定性预留裕度"},{"key":"B","text":"提高网络带宽"},{"key":"C","text":"增加视觉面积"},{"key":"D","text":"减少日志"}],"answer":"A","answerText":"为定位误差、控制误差等不确定性预留裕度"},{"id":194,"type":"单选题","stem":"临时移动障碍物出现后，路径规划系统若能实时更新路径，这类能力通常称为？","options":[{"key":"A","text":"静态建模"},{"key":"B","text":"电池均衡"},{"key":"C","text":"数据归档"},{"key":"D","text":"动态重规划"}],"answer":"D","answerText":"动态重规划"},{"id":195,"type":"单选题","stem":"动态重规划时最应避免的是？","options":[{"key":"A","text":"保存新路径"},{"key":"B","text":"新路径解决当前障碍却引入新的机间冲突或越界"},{"key":"C","text":"更新障碍物位置"},{"key":"D","text":"重新计算"}],"answer":"B","answerText":"新路径解决当前障碍却引入新的机间冲突或越界"},{"id":196,"type":"单选题","stem":"多架无人机共用狭窄通道时，可将通道视为？","options":[{"key":"A","text":"无限容量空间"},{"key":"B","text":"不受约束区域"},{"key":"C","text":"只与灯光有关"},{"key":"D","text":"需要调度的共享资源"}],"answer":"D","answerText":"需要调度的共享资源"},{"id":197,"type":"单选题","stem":"给不同无人机设置通行优先级的主要作用是？","options":[{"key":"A","text":"提高电池电压"},{"key":"B","text":"自动提高定位精度"},{"key":"C","text":"在资源冲突时决定先后顺序"},{"key":"D","text":"改变机体重量"}],"answer":"C","answerText":"在资源冲突时决定先后顺序"},{"id":198,"type":"单选题","stem":"规划轨迹在数学上无碰撞，但要求无人机瞬时从0加速到最大速度，说明？","options":[{"key":"A","text":"只需更换灯光"},{"key":"B","text":"只需改文件名"},{"key":"C","text":"轨迹一定安全可飞"},{"key":"D","text":"轨迹缺乏动力学可执行性"}],"answer":"D","answerText":"轨迹缺乏动力学可执行性"},{"id":199,"type":"单选题","stem":"同一时刻两机位置分别为(0,0,0)和(0.6,0.8,0)（米），规定最小安全距离为1.1米。忽略误差，应判断为？","options":[{"key":"A","text":"仅凭距离无法判断任何情况"},{"key":"B","text":"满足最小安全间距"},{"key":"C","text":"一定越出飞行边界"},{"key":"D","text":"存在安全间距冲突"}],"answer":"D","answerText":"存在安全间距冲突"},{"id":200,"type":"单选题","stem":"某任务规定两机距离必须“大于或等于1.0米”。仿真得到全程最小距离恰为1.0米。忽略误差时，正确判断是？","options":[{"key":"A","text":"名义上满足阈值，但没有额外安全裕度"},{"key":"B","text":"一定不满足，因为必须大于2米"},{"key":"C","text":"一定十分安全，无需考虑误差"},{"key":"D","text":"只看起飞时距离即可"}],"answer":"A","answerText":"名义上满足阈值，但没有额外安全裕度"},{"id":201,"type":"单选题","stem":"判断两架无人机路径是否发生时空冲突，最关键的指标之一是？","options":[{"key":"A","text":"两条路径文件大小之差"},{"key":"B","text":"两机在重叠任务时间内的最小空间间距"},{"key":"C","text":"两机起飞编号之差"},{"key":"D","text":"两机灯光颜色差异"}],"answer":"B","answerText":"两机在重叠任务时间内的最小空间间距"},{"id":202,"type":"单选题","stem":"制定多机安全间距时，以下考虑最完整的是？","options":[{"key":"A","text":"无人机尺寸、定位与控制误差、速度及环境扰动等因素"},{"key":"B","text":"只看无人机机身颜色"},{"key":"C","text":"只看任务文件大小"},{"key":"D","text":"只按操作员经验固定一个最小值且不做校验"}],"answer":"A","answerText":"无人机尺寸、定位与控制误差、速度及环境扰动等因素"},{"id":203,"type":"单选题","stem":"通过设置不同高度层来减少两机路径交叉冲突时，仍必须保证什么？","options":[{"key":"A","text":"只要目标高度不同就一定安全"},{"key":"B","text":"两机灯光必须不同"},{"key":"C","text":"进入、离开高度层的过渡轨迹及全程垂直间距也满足安全要求"},{"key":"D","text":"两机必须同时加速"}],"answer":"C","answerText":"进入、离开高度层的过渡轨迹及全程垂直间距也满足安全要求"},{"id":204,"type":"单选题","stem":"两架无人机沿相向路径接近。在当前间距相同的情况下，相对闭合速度越大通常意味着？","options":[{"key":"A","text":"留给冲突识别和处置的时间越短"},{"key":"B","text":"碰撞风险一定自动消失"},{"key":"C","text":"安全距离可以相应减小到0"},{"key":"D","text":"只会影响灯光同步"}],"answer":"A","answerText":"留给冲突识别和处置的时间越短"},{"id":205,"type":"单选题","stem":"一段路径长60米，计划按不超过2米/秒的速度匀速通过。理论上最短用时约为？","options":[{"key":"A","text":"40秒"},{"key":"B","text":"20秒"},{"key":"C","text":"15秒"},{"key":"D","text":"30秒"}],"answer":"D","answerText":"30秒"},{"id":206,"type":"单选题","stem":"某路径在原速度上限下可按时完成。若最大允许速度被下调而截止时间不变，最合理的判断是？","options":[{"key":"A","text":"原路径一定仍可完成"},{"key":"B","text":"原方案可能变得不可行，需要重新评估路径、速度和时序"},{"key":"C","text":"只需提高灯光亮度即可"},{"key":"D","text":"速度上限与任务可行性无关"}],"answer":"B","answerText":"原方案可能变得不可行，需要重新评估路径、速度和时序"},{"id":207,"type":"单选题","stem":"为消解多机冲突，规划中给某架无人机增加等待/悬停时间。该措施会直接影响哪些任务预算？","options":[{"key":"A","text":"时间与能量预算"},{"key":"B","text":"机架轴距"},{"key":"C","text":"电池额定电压"},{"key":"D","text":"螺旋桨数量"}],"answer":"A","answerText":"时间与能量预算"},{"id":208,"type":"单选题","stem":"路径规划中，“最大允许速度”与“最优规划速度”的关系，正确的是？","options":[{"key":"A","text":"两者必然相等"},{"key":"B","text":"最优速度应在安全和约束范围内综合时间、能耗、平滑性等目标确定"},{"key":"C","text":"最优速度一定大于最大允许速度"},{"key":"D","text":"最大允许速度只与灯光有关"}],"answer":"B","answerText":"最优速度应在安全和约束范围内综合时间、能耗、平滑性等目标确定"},{"id":209,"type":"单选题","stem":"某矩形飞行区一维宽度为20米，两侧各预留1米安全缓冲，则该方向可用于规划的有效宽度为？","options":[{"key":"A","text":"2米"},{"key":"B","text":"22米"},{"key":"C","text":"18米"},{"key":"D","text":"19米"}],"answer":"C","answerText":"18米"},{"id":210,"type":"单选题","stem":"飞行区域一侧临近固定障碍物，因此该侧需要比其他方向预留更大的安全缓冲。对有效可规划空间的影响是？","options":[{"key":"A","text":"有效空间会向风险较低的一侧收缩，边界缓冲可呈非对称"},{"key":"B","text":"有效空间完全不受影响"},{"key":"C","text":"所有方向必须使用完全相同的缓冲值"},{"key":"D","text":"只改变任务文件名"}],"answer":"A","answerText":"有效空间会向风险较低的一侧收缩，边界缓冲可呈非对称"},{"id":211,"type":"单选题","stem":"在二维或三维路径规划中，将障碍物外轮廓按安全半径向外扩张后再进行寻路，这种处理的主要目的是什么？","options":[{"key":"A","text":"缩小无人机尺寸"},{"key":"B","text":"提高最大速度"},{"key":"C","text":"把安全间距转化为扩张后的禁入区域，便于规划避障"},{"key":"D","text":"取消边界检查"}],"answer":"C","answerText":"把安全间距转化为扩张后的禁入区域，便于规划避障"},{"id":212,"type":"单选题","stem":"一条规划轨迹的所有航点都位于允许飞行区域内。是否可以直接判定整条轨迹不越界？","options":[{"key":"A","text":"不可以，还需检查航点之间的连续轨迹/插值段"},{"key":"B","text":"可以，航点合规即可"},{"key":"C","text":"可以，只要首末点合规"},{"key":"D","text":"只需检查最高点"}],"answer":"A","answerText":"不可以，还需检查航点之间的连续轨迹/插值段"},{"id":213,"type":"单选题","stem":"在安全性、速度和其他条件完全相同的理想情况下，候选路径A长100米，路径B长120米。若仅以路径长度为优化目标，应如何选择？","options":[{"key":"A","text":"无法比较路径长度"},{"key":"B","text":"路径A更短"},{"key":"C","text":"路径B更短"},{"key":"D","text":"两条路径等长"}],"answer":"B","answerText":"路径A更短"},{"id":214,"type":"单选题","stem":"候选路径A比路径B短10%，但A在一处违反最小安全距离，B满足全部安全约束。应优先选择？","options":[{"key":"A","text":"A，因为更短"},{"key":"B","text":"B，因为安全约束应先满足"},{"key":"C","text":"两条路径等价"},{"key":"D","text":"随机选择"}],"answer":"B","answerText":"B，因为安全约束应先满足"},{"id":215,"type":"单选题","stem":"多目标路径优化同时考虑时间、距离、能耗和平滑性时，关于安全约束的处理正确的是？","options":[{"key":"A","text":"安全约束应作为硬约束优先满足，不能为降低其他代价而突破"},{"key":"B","text":"只要时间更短即可突破安全距离"},{"key":"C","text":"能耗最低时可以忽略禁飞边界"},{"key":"D","text":"平滑性高即可忽略碰撞检测"}],"answer":"A","answerText":"安全约束应作为硬约束优先满足，不能为降低其他代价而突破"},{"id":216,"type":"单选题","stem":"多架无人机从不同起点前往多个目标点。合理优化“起点—目标点”分配，通常有助于？","options":[{"key":"A","text":"只增加任务文件大小"},{"key":"B","text":"只改变灯光颜色"},{"key":"C","text":"保证每架无人机路径长度完全相同"},{"key":"D","text":"减少总路径长度和不必要的交叉冲突"}],"answer":"D","answerText":"减少总路径长度和不必要的交叉冲突"},{"id":217,"type":"单选题","stem":"地面站系统启动后，正式导入任务前首先应确认？","options":[{"key":"A","text":"直接发送起飞指令"},{"key":"B","text":"删除全部告警记录"},{"key":"C","text":"软件、设备和关键服务初始化正常"},{"key":"D","text":"关闭定位系统"}],"answer":"C","answerText":"软件、设备和关键服务初始化正常"},{"id":218,"type":"单选题","stem":"系统初始化时发现某关键模块版本不兼容，正确做法是？","options":[{"key":"A","text":"停止进入正式任务，按兼容要求处理并重新验证"},{"key":"B","text":"随机卸载其他模块"},{"key":"C","text":"忽略告警继续飞行"},{"key":"D","text":"只修改界面显示"}],"answer":"A","answerText":"停止进入正式任务，按兼容要求处理并重新验证"},{"id":219,"type":"单选题","stem":"系统联调的核心目标是？","options":[{"key":"A","text":"确认地面站、无人机、通信和定位等能够协同工作"},{"key":"B","text":"只确认灯光颜色"},{"key":"C","text":"只统计设备箱数量"},{"key":"D","text":"只检查电脑外观"}],"answer":"A","answerText":"确认地面站、无人机、通信和定位等能够协同工作"},{"id":220,"type":"单选题","stem":"联调时单机正常、群体接入后网络明显拥塞，最应优先排查？","options":[{"key":"A","text":"网络容量、信道占用和接入配置"},{"key":"B","text":"任务文件字体"},{"key":"C","text":"螺旋桨颜色"},{"key":"D","text":"场地灯光"}],"answer":"A","answerText":"网络容量、信道占用和接入配置"},{"id":221,"type":"单选题","stem":"地面站无法发现部分无人机，首先应检查的通用项目之一是？","options":[{"key":"A","text":"场地观众数量"},{"key":"B","text":"通信链路和网络配置是否正常"},{"key":"C","text":"电池标签字体"},{"key":"D","text":"机身颜色"}],"answer":"B","answerText":"通信链路和网络配置是否正常"},{"id":222,"type":"单选题","stem":"同一局域网中两台关键设备设置了相同IP地址，最可能出现？","options":[{"key":"A","text":"飞行高度增加"},{"key":"B","text":"电池自动充满"},{"key":"C","text":"定位精度必然提高"},{"key":"D","text":"地址冲突导致通信异常"}],"answer":"D","answerText":"地址冲突导致通信异常"},{"id":223,"type":"单选题","stem":"更换网络设备后，地面站与无人机无法通信。合理的排查顺序是？","options":[{"key":"A","text":"先删除任务日志"},{"key":"B","text":"先更换螺旋桨"},{"key":"C","text":"先确认物理连接/无线接入，再核对地址与协议配置"},{"key":"D","text":"先修改飞行轨迹"}],"answer":"C","answerText":"先确认物理连接/无线接入，再核对地址与协议配置"},{"id":224,"type":"单选题","stem":"定位系统配置完成后，起飞前应重点确认？","options":[{"key":"A","text":"仅确认定位设备外观无划痕"},{"key":"B","text":"只要至少一架无人机定位正常即可"},{"key":"C","text":"只确认地图底图加载成功"},{"key":"D","text":"各无人机定位状态及质量满足任务要求"}],"answer":"D","answerText":"各无人机定位状态及质量满足任务要求"},{"id":225,"type":"单选题","stem":"定位状态不稳定但仍能偶尔获得位置时，最合理的做法是？","options":[{"key":"A","text":"提高任务速度"},{"key":"B","text":"暂停起飞，排查定位环境和系统状态"},{"key":"C","text":"关闭定位告警"},{"key":"D","text":"立即起飞利用短暂定位"}],"answer":"B","answerText":"暂停起飞，排查定位环境和系统状态"},{"id":226,"type":"单选题","stem":"基站或定位参考设备位置改变后，通常应？","options":[{"key":"A","text":"降低灯光亮度"},{"key":"B","text":"重新核对或标定定位参考关系"},{"key":"C","text":"无需处理"},{"key":"D","text":"只重命名任务文件"}],"answer":"B","answerText":"重新核对或标定定位参考关系"},{"id":227,"type":"单选题","stem":"导入群飞任务数据后，第一项通用检查应包括？","options":[{"key":"A","text":"删除安全校验"},{"key":"B","text":"先起飞看效果"},{"key":"C","text":"任务文件是否完整、版本/格式是否正确"},{"key":"D","text":"只看文件大小"}],"answer":"C","answerText":"任务文件是否完整、版本/格式是否正确"},{"id":228,"type":"单选题","stem":"任务文件的无人机数量与当前在线设备数量不一致，正确做法是？","options":[{"key":"A","text":"随机复制一条轨迹"},{"key":"B","text":"忽略差异直接执行"},{"key":"C","text":"核对任务规模、设备状态和映射关系后再继续"},{"key":"D","text":"关闭在线数量显示"}],"answer":"C","answerText":"核对任务规模、设备状态和映射关系后再继续"},{"id":229,"type":"单选题","stem":"任务文件校验值与发布方提供的不一致，最可能说明？","options":[{"key":"A","text":"风速一定超限"},{"key":"B","text":"定位一定正常"},{"key":"C","text":"文件可能传输不完整或发生改变"},{"key":"D","text":"电池一定低电"}],"answer":"C","answerText":"文件可能传输不完整或发生改变"},{"id":230,"type":"单选题","stem":"地面站三维仿真的主要作用是？","options":[{"key":"A","text":"给电池充电"},{"key":"B","text":"改变空域审批"},{"key":"C","text":"在实飞前预览任务并检查轨迹、边界和冲突"},{"key":"D","text":"替代所有现场安全措施"}],"answer":"C","answerText":"在实飞前预览任务并检查轨迹、边界和冲突"},{"id":231,"type":"单选题","stem":"仿真中某架无人机越出安全边界，应？","options":[{"key":"A","text":"停止提交，修改任务并重新仿真"},{"key":"B","text":"忽略仿真结果"},{"key":"C","text":"正式飞行时手动纠正"},{"key":"D","text":"只关闭告警"}],"answer":"A","answerText":"停止提交，修改任务并重新仿真"},{"id":232,"type":"单选题","stem":"地面站发送“解锁”指令前，最重要的是？","options":[{"key":"A","text":"取消安全边界"},{"key":"B","text":"先接触旋转部件"},{"key":"C","text":"确认人员安全、设备状态和起飞条件已满足"},{"key":"D","text":"关闭所有状态监控"}],"answer":"C","answerText":"确认人员安全、设备状态和起飞条件已满足"},{"id":233,"type":"单选题","stem":"地面站准备发送集群起飞指令时，若一架任务机仍有关键红色告警，应？","options":[{"key":"A","text":"忽略一架异常继续"},{"key":"B","text":"多次点击起飞覆盖告警"},{"key":"C","text":"删除该告警记录后起飞"},{"key":"D","text":"暂停起飞并处理告警"}],"answer":"D","answerText":"暂停起飞并处理告警"},{"id":234,"type":"单选题","stem":"“悬停”指令通常期望无人机？","options":[{"key":"A","text":"随机改变方向"},{"key":"B","text":"返回起飞点"},{"key":"C","text":"立即关闭电机"},{"key":"D","text":"在当前位置附近保持位置和高度"}],"answer":"D","answerText":"在当前位置附近保持位置和高度"},{"id":235,"type":"单选题","stem":"设置返航策略时，需特别关注？","options":[{"key":"A","text":"返航路径、高度、障碍物和剩余能量"},{"key":"B","text":"文件夹名称"},{"key":"C","text":"显示器分辨率"},{"key":"D","text":"灯光颜色"}],"answer":"A","answerText":"返航路径、高度、障碍物和剩余能量"},{"id":236,"type":"单选题","stem":"发送降落指令前，应重点确认？","options":[{"key":"A","text":"降落区域安全且无人机状态允许降落"},{"key":"B","text":"观众靠近无人机"},{"key":"C","text":"取消定位检查"},{"key":"D","text":"所有电机转速最高"}],"answer":"A","answerText":"降落区域安全且无人机状态允许降落"},{"id":237,"type":"单选题","stem":"在未完成任务导入和安全校验前直接发送起飞指令，主要违反了？","options":[{"key":"A","text":"正常的任务执行顺序和安全联锁原则"},{"key":"B","text":"颜色管理原则"},{"key":"C","text":"文件命名原则"},{"key":"D","text":"仓库管理原则"}],"answer":"A","answerText":"正常的任务执行顺序和安全联锁原则"},{"id":238,"type":"单选题","stem":"地面站界面使用不同颜色或图标区分正常、警告和故障状态，主要为了？","options":[{"key":"A","text":"增加网络带宽"},{"key":"B","text":"降低电池温度"},{"key":"C","text":"提高定位精度"},{"key":"D","text":"帮助操作者快速识别状态等级"}],"answer":"D","answerText":"帮助操作者快速识别状态等级"},{"id":239,"type":"单选题","stem":"出现多个告警时，操作者应优先处理？","options":[{"key":"A","text":"最早产生但已恢复的提示"},{"key":"B","text":"字体最大的告警"},{"key":"C","text":"可能直接影响飞行安全的高等级告警"},{"key":"D","text":"最容易关闭的告警"}],"answer":"C","answerText":"可能直接影响飞行安全的高等级告警"},{"id":240,"type":"单选题","stem":"某告警在重启后消失，但原因未明确，正确做法是？","options":[{"key":"A","text":"直接投入最高风险任务"},{"key":"B","text":"立即删除全部日志"},{"key":"C","text":"结合日志和复现条件继续核查，不把“消失”视为已解决"},{"key":"D","text":"认为必然是假告警"}],"answer":"C","answerText":"结合日志和复现条件继续核查，不把“消失”视为已解决"},{"id":241,"type":"单选题","stem":"地面站飞前检查通常不包括下列哪项？","options":[{"key":"A","tex ":"D","text":"直接清空日志"}],"answer":"C","answerText":"记录变更并重新进行必要的校验/仿真"},{"id":250,"type":"单选题","stem":"正式任务前备份有效配置和任务文件的主要作用是？","options":[{"key":"A","text":"替代安全检查"},{"key":"B","text":"自动提高链路质量"},{"key":"C","text":"增加飞行高度"},{"key":"D","text":"异常时便于恢复到已验证状态"}],"answer":"D","answerText":"异常时便于恢复到已验证状态"},{"id":251,"type":"单选题","stem":"地面站软件出现无响应且无法确认指令状态时，首要原则是？","options":[{"key":"A","text":"让人员进入飞行区观察"},{"key":"B","text":"关闭现场隔离"},{"key":"C","text":"优先保障飞行安全并按预案处置，不盲目重复下发指令"},{"key":"D","text":"不断快速点击全部按钮"}],"answer":"C","answerText":"优先保障飞行安全并按预案处置，不盲目重复下发指令"},{"id":252,"type":"单选题","stem":"群飞任务结束后，地面站侧应完成的通用工作包括？","options":[{"key":"A","text":"确认全部无人机安全结束任务并保存必要日志数据"},{"key":"B","text":"保持电机转动并搬运"},{"key":"C","text":"立即删除任务记录"},{"key":"D","text":"关闭所有记录功能"}],"answer":"A","answerText":"确认全部无人机安全结束任务并保存必要日志数据"},{"id":253,"type":"单选题","stem":"集群状态监控中，位置数据最直接用于判断？","options":[{"key":"A","text":"电池是否鼓包"},{"key":"B","text":"任务文件是否压缩"},{"key":"C","text":"无人机是否在预期区域和轨迹附近"},{"key":"D","text":"机架材质"}],"answer":"C","answerText":"无人机是否在预期区域和轨迹附近"},{"id":254,"type":"单选题","stem":"某架无人机位置连续偏离目标轨迹且偏差扩大，应？","options":[{"key":"A","text":"关闭位置显示"},{"key":"B","text":"将其视为异常趋势并及时评估处置"},{"key":"C","text":"提高灯光亮度"},{"key":"D","text":"只看一次数据后忽略"}],"answer":"B","answerText":"将其视为异常趋势并及时评估处置"},{"id":255,"type":"单选题","stem":"实时速度超过任务设定上限，首先说明？","options":[{"key":"A","text":"存在速度约束异常，需要评估安全风险"},{"key":"B","text":"电池必然损坏"},{"key":"C","text":"日志必然错误"},{"key":"D","text":"定位必然丢失"}],"answer":"A","answerText":"存在速度约束异常，需要评估安全风险"},{"id":256,"type":"单选题","stem":"速度值瞬间出现不合理尖峰，但位置轨迹无对应变化，较合适的判断是？","options":[{"key":"A","text":"一定是真实高速飞行"},{"key":"B","text":"一定是电池低电"},{"key":"C","text":"可直接删除日志"},{"key":"D","text":"可能存在测量或数据异常，应结合其他参数核查"}],"answer":"D","answerText":"可能存在测量或数据异常，应结合其他参数核查"},{"id":257,"type":"单选题","stem":"高度监控的核心目的之一是？","options":[{"key":"A","text":"统计仓库库存"},{"key":"B","text":"发现超高、过低或异常高度变化"},{"key":"C","text":"修改灯光颜色"},{"key":"D","text":"调整网络密码"}],"answer":"B","answerText":"发现超高、过低或异常高度 ","answerText":"兼顾个体异常和系统性异常识别"},{"id":275,"type":"单选题","stem":"操作者确认一个告警已恢复后，正确做法通常是？","options":[{"key":"A","text":"核实相关状态恢复并记录必要信息"},{"key":"B","text":"直接删除所有历史记录"},{"key":"C","text":"无需关注恢复原因"},{"key":"D","text":"关闭该类告警永久不再显示"}],"answer":"A","answerText":"核实相关状态恢复并记录必要信息"},{"id":276,"type":"单选题","stem":"启用冗余机替换异常任务机后，应重点确认？","options":[{"key":"A","text":"冗余机在线、定位、编号映射和任务状态均正确"},{"key":"B","text":"只看灯光颜色"},{"key":"C","text":"只确认存储箱编号"},{"key":"D","text":"只确认外观"}],"answer":"A","answerText":"冗余机在线、定位、编号映射和任务状态均正确"},{"id":277,"type":"单选题","stem":"监控阈值设置过宽的主要风险是？","options":[{"key":"A","text":"坐标系改变"},{"key":"B","text":"必然产生更多误报"},{"key":"C","text":"电池容量下降"},{"key":"D","text":"异常可能被过晚发现"}],"answer":"D","answerText":"异常可能被过晚发现"},{"id":278,"type":"单选题","stem":"监控阈值设置过窄的主要问题可能是？","options":[{"key":"A","text":"无线链路加密"},{"key":"B","text":"正常波动频繁触发误报"},{"key":"C","text":"飞行高度增加"},{"key":"D","text":"所有异常都消失"}],"answer":"B","answerText":"正常波动频繁触发误报"},{"id":279,"type":"单选题","stem":"任务末段监控除了确认队形结束外，还应继续关注？","options":[{"key":"A","text":"关闭状态显示后再降落"},{"key":"B","text":"让部分无人机无人监管"},{"key":"C","text":"只保留灯光"},{"key":"D","text":"全部无人机安全降落并结束运行（七）飞行数据分析（第280-300题）"}],"answer":"D","answerText":"全部无人机安全降落并结束运行（七）飞行数据分析（第280-300题）"},{"id":280,"type":"单选题","stem":"飞行结束后导出飞行日志的主要目的之一是？","options":[{"key":"A","text":"支持任务复盘、故障分析和结果追溯"},{"key":"B","text":"提高电池容量"},{"key":"C","text":"增加无线功率"},{"key":"D","text":"改变飞行边界"}],"answer":"A","answerText":"支持任务复盘、故障分析和结果追溯"},{"id":281,"type":"单选题","stem":"导出日志时仅保存部分无人机数据的主要风险是？","options":[{"key":"A","text":"无法完整还原群体任务状态"},{"key":"B","text":"文件一定更安全"},{"key":"C","text":"飞行速度变快"},{"key":"D","text":"定位精度提高"}],"answer":"A","answerText":"无法完整还原群体任务状态"},{"id":282,"type":"单选题","stem":"检查任务数据完整性的核心问题是？","options":[{"key":"A","text":"无人机外观是否相同"},{"key":"B","text":"所需数据是否缺失、损坏或被意外改变"},{"key":"C","text":"文件颜色是否统一"},{"key":"D","text":"电脑品牌是否一致"}],"answer":"B","answerText":"所需数据是否缺失、损坏或被意外改变"},{"id":283,"type":"单选题","stem":"同一任务文件在发送前后校验值不同，首先应怀疑？","options":[{"key":"A","text":"机头方向变化"},{"key":"B","text":"文件在传输或保存过程中发生改变或损坏"},{"key":"C","text":"风速变化"},{"key":"D","text":"电池电量变化"}],"answer":"B","answerText":"文件在传输或保存过程中发生改变或损坏"},{"id":284,"type":"单选题","stem":"分析群飞任务是否超出安全高度，应重点查看？","options":[{"key":"A","text":"显示器分辨率"},{"key":"B","text":"文件大小"},{"key":"C","text":"电池生产日期"},{"key":"D","text":"高度数据"}],"answer":"D","answerText":"高度数据"},{"id":285,"type":"单选题","stem":"分析某架无人机是否存在异常耗电，应对比？","options":[{"key":"A","text":"电量随时间变化并与同类任务机/基准比较"},{"key":"B","text":"日志字体"},{"key":"C","text":"机身颜色"},{"key":"D","text":"起飞点标签"}],"answer":"A","answerText":"电量随时间变化并与同类任务机/基准比较"},{"id":286,"type":"单选题","stem":"飞行日志中的异常代码最合理的使用方式是？","options":[{"key":"A","text":"结合代码定义、发生时间和相关参数判断异常"},{"key":"B","text":"只凭代码数字大小判断严重度"},{"key":"C","text":"只按颜色猜测故障"},{"key":"D","text":"看到任何代码都删除日志"}],"answer":"A","answerText":"结合代码定义、发生时间和相关参数判断异常"},{"id":287,"type":"单选题","stem":"相同异常代码在不同时间多次出现，分析时应优先关注？","options":[{"key":"A","text":"异常代码编号大小"},{"key":"B","text":"出现频率、触发条件和相关参数变化"},{"key":"C","text":"只统计任务文件数量"},{"key":"D","text":"只比较设备编号顺序"}],"answer":"B","answerText":"出现频率、触发条件和相关参数变化"},{"id":288,"type":"单选题","stem":"轨迹偏差通常指？","options":[{"key":"A","text":"实际飞行轨迹与计划轨迹之间的差异"},{"key":"B","text":"两份文件大小差异"},{"key":"C","text":"两台电脑性能差异"},{"key":"D","text":"两块电池容量差异"}],"answer":"A","answerText":"实际飞行轨迹与计划轨迹之间的差异"},{"id":289,"type":"单选题","stem":"计算某时刻位置偏差最直接的方法是？","options":[{"key":"A","text":"比较灯光亮度"},{"key":"B","text":"比较电池温度"},{"key":"C","text":"比较实际位置与计划位置的空间距离"},{"key":"D","text":"比较文件大小"}],"answer":"C","answerText":"比较实际位置与计划位置的空间距离"},{"id":290,"type":"单选题","stem":"仅用平均轨迹偏差评价一次任务可能掩盖什么？","options":[{"key":"A","text":"文件版本"},{"key":"B","text":"所有正常数据"},{"key":"C","text":"电池型号"},{"key":"D","text":"少数时刻的严重峰值偏差"}],"answer":"D","answerText":"少数时刻的严重峰值偏差"},{"id":291,"type":"单选题","stem":"判断队形任务是否完成，至少应核对？","options":[{"key":"A","text":"仅核对起飞数量"},{"key":"B","text":"仅核对灯光是否亮起"},{"key":"C","text":"目标点到达、规定保持时长以及按要求完成降落等任务要求"},{"key":"D","text":"仅核对总飞行时长"}],"answer":"C","answerText":"目标点到达、规定保持时长以及按要求完成降落等任务要求"},{"id":292,"type":"单选题","stem":"某任务所有无人机到达目标队形，但保持时长不足，结论应是？","options":[{"key":"A","text":"只要点位正确就无需时长"},{"key":"B","text":"可删除时间数据"},{"key":"C","text":"任务未完全满足完成要求"},{"key":"D","text":"任务一定完全成功"}],"answer":"C","answerText":"任务未完全满足完成要求"},{"id":293,"type":"单选题","stem":"分析多架无人机日志前进行时间对齐的主要原因是？","options":[{"key":"A","text":"改变坐标系"},{"key":"B","text":"降低电池温度"},{"key":"C","text":"提高定位精度"},{"key":"D","text":"便于比较同一时刻各机状态和事件"}],"answer":"D","answerText":"便于比较同一时刻各机状态和事件"},{"id":294,"type":"单选题","stem":"日志中出现单个明显超出物理可能范围的孤立值，正确做法是？","options":[{"key":"A","text":"直接删除整份日志"},{"key":"B","text":"直接当作真实飞行状态"},{"key":"C","text":"先核查传感、时间戳和上下文，再决定是否标记为异常数据"},{"key":"D","text":"用任意数值替代"}],"answer":"C","answerText":"先核查传感、时间戳和上下文，再决定是否标记为异常数据"},{"id":295,"type":"单选题","stem":"发现位置偏差与定位质量下降在时间上同步出现，合理的下一步是？","options":[{"key":"A","text":"立即认定唯一原因且停止分析"},{"key":"B","text":"进一步结合其他参数验证定位异常是否与偏差相关"},{"key":"C","text":"只看灯光数据"},{"key":"D","text":"删除通信日志"}],"answer":"B","answerText":"进一步结合其他参数验证定位异常是否与偏差相关"},{"id":296,"type":"单选题","stem":"飞行结果报告中最不应缺少的是？","options":[{"key":"A","text":"只记录最终结果而不说明过程"},{"key":"B","text":"任务基本信息、关键结果、异常及处置记录"},{"key":"C","text":"只记录正常数据并省略异常"},{"key":"D","text":"只附截图而不说明关键结论"}],"answer":"B","answerText":"任务基本信息、关键结果、异常及处置记录"},{"id":297,"type":"单选题","stem":"报告中对一次异常的描述，哪种方式最专业？","options":[{"key":"A","text":"删除异常避免影响结论"},{"key":"B","text":"仅写操作者感受"},{"key":"C","text":"只写“有点问题”"},{"key":"D","text":"记录时间、现象、相关数据、处置和结果"}],"answer":"D","answerText":"记录时间、现象、相关数据、处置和结果"},{"id":298,"type":"单选题","stem":"用时间曲线展示高度和电量变化的主要价值是？","options":[{"key":"A","text":"提升电池性能"},{"key":"B","text":"直观观察趋势、突变和事件对应关系"},{"key":"C","text":"自动修复故障"},{"key":"D","text":"改变原始数据"}],"answer":"B","answerText":"直观观察趋势、突变和事件对应关系"},{"id":299,"type":"单选题","stem":"比较多架无人机轨迹偏差时，除平均值外还应关注？","options":[{"key":"A","text":"设备标签字体"},{"key":"B","text":"地面站桌面图标"},{"key":"C","text":"最大值、分布和异常个体"},{"key":"D","text":"文件颜色"}],"answer":"C","answerText":"最大值、分布和异常个体"},{"id":300,"type":"单选题","stem":"对用于事故或异常分析的原始日志，正确原则是？","options":[{"key":"A","text":"直接覆盖原始文件"},{"key":"B","text":"只保留截图"},{"key":"C","text":"妥善保存原始数据，分析时使用可追溯副本"},{"key":"D","text":"随意修改时间戳答题说明：每题有两个或两个以上正确答案，须全部选对方可得分。"}],"answer":"C","answerText":"妥善保存原始数据，分析时使用可追溯副本"},{"id":301,"type":"多选题","stem":"下列哪些做法符合无人机群飞作业的职业道德要求？","options":[{"key":"A","text":"按职责主动沟通协作"},{"key":"B","text":"为赶进度隐瞒设备问题"},{"key":"C","text":"如实记录异常和处置结果"},{"key":"D","text":"未经授权篡改他人任务数据"}],"answer":"AC","answerText":"按职责主动沟通协作如实记录异常和处置结果"},{"id":302,"type":"多选题","stem":"发现任务程序可能存在安全缺陷时，符合认真负责要求的做法包括？","options":[{"key":"A","text":"为了不影响进度直接实飞"},{"key":"B","text":"暂停继续使用该程序"},{"key":"C","text":"删除告警记录后继续"},{"key":"D","text":"报告风险并组织复核"}],"answer":"BD","answerText":"暂停继续使用该程序报告风险并组织复核"},{"id":303,"type":"多选题","stem":"技术交接时应包含哪些内容？","options":[{"key":"A","text":"尚未解决的风险"},{"key":"B","text":"已知异常及处置情况"},{"key":"C","text":"只需说明最终结果，无需说明当前设备状态"},{"key":"D","text":"故意省略可能影响安全的信息"}],"answer":"AB","answerText":"尚未解决的风险已知异常及处置情况"},{"id":304,"type":"多选题","stem":"按《无人驾驶航空器飞行管理暂行条例》，实施飞行活动时应遵守的要求包括？","options":[{"key":"A","text":"飞前做好安全准备并检查航空器状态"},{"key":"B","text":"实时掌握无人机飞行动态"},{"key":"C","text":"受到酒精影响时可降低速度继续操控"},{"key":"D","text":"保持必要的安全间隔"}],"answer":"ABD","answerText":"飞前做好安全准备并检查航空器状态实时掌握无人机飞行动态保持必要的安全间隔"},{"id":305,"type":"多选题","stem":"在夜间或低能见度条件下实施无人机飞行，正确措施包括？","options":[{"key":"A","text":"低能见度时可关闭状态监控以减少干扰"},{"key":"B","text":"夜间飞行可降低对其他运行限制的要求"},{"key":"C","text":"开启灯光系统"},{"key":"D","text":"确认灯光系统处于良好工作状态"}],"answer":"CD","answerText":"开启灯光系统确认灯光系统处于良好工作状态"},{"id":306,"type":"多选题","stem":"根据条例，无人驾驶航空器应避让的对象包括？","options":[{"key":"A","text":"有人驾驶航空器"},{"key":"B","text":"无动力装置的航空器"},{"key":"C","text":"所有情况下都要求集群飞行避让单架飞行"},{"key":"D","text":"地面、水上交通工具"}],"answer":"ABD","answerText":"有人驾驶航空器无动力装置的航空器地面、水上交通工具"},{"id":307,"type":"多选题","stem":"条例中的“集群”具有哪些关键特征？","options":[{"key":"A","text":"为了处理同一任务"},{"key":"B","text":"采用具备多台无人机操控能力的同一系统或平台"},{"key":"C","text":"多架无人机必须由不同系统互不通信地单独操控"},{"key":"D","text":"操控数据互联协同处理"}],"answer":"ABD","answerText":"为了处理同一任务采用具备多台无人机操控能力的同一系统或平台操控数据互联协同处理"},{"id":308,"type":"多选题","stem":"按条例，轻型无人驾驶航空器除重量条件外，还应具备的相关特征包括？","options":[{"key":"A","text":"符合空域管理要求的空域保持能力"},{"key":"B","text":"可靠被监视能力"},{"key":"C","text":"必须没有任何无线电设备"},{"key":"D","text":"全程可以随时人工介入操控"}],"answer":"ABD","answerText":"符合空域管理要求的空域保持能力可靠被监视能力全程可以随时人工介入操控"},{"id":309,"type":"多选题","stem":"提高群飞安全边界裕度时，可考虑的因素包括？","options":[{"key":"A","text":"只要任务文件通过即可，不必考虑环境裕度"},{"key":"B","text":"只要平均风速未超限，就无需为阵风预留裕度"},{"key":"C","text":"控制误差"},{"key":"D","text":"定位精度"}],"answer":"CD","answerText":"控制误差定位精度"},{"id":310,"type":"多选题","stem":"场地风险识别通常应覆盖哪些方面？","options":[{"key":"A","text":"人员与安全隔离"},{"key":"B","text":"只看任务动画是否美观"},{"key":"C","text":"仅检查起飞点，不必检查飞行边界和障碍物"},{"key":"D","text":"电磁/通信环境"}],"answer":"AD","answerText":"人员与安全隔离电磁/通信环境"},{"id":311,"type":"多选题","stem":"发生飞行异常时，合理的处置原则包括？","options":[{"key":"A","text":"按预案选择暂停、返航、降落等措施"},{"key":"B","text":"服从适用的空中交通管理指令"},{"key":"C","text":"及时识别异常影响"},{"key":"D","text":"为保存成绩而忽略安全问题"}],"answer":"ABC","answerText":"按预案选择暂停、返航、降落等措施服从适用的空中交通管理指令及时识别异常影响"},{"id":312,"type":"多选题","stem":"发生导致飞行安全问题的异常后，组织飞行活动的单位或个人应当采取哪些做法？","options":[{"key":"A","text":"及时处置异常"},{"key":"B","text":"保留必要的相关运行记录和日志"},{"key":"C","text":"删除异常日志避免留下记录"},{"key":"D","text":"按规定在规定时限内向空中交通管理机构报告"}],"answer":"ABD","answerText":"及时处置异常保留必要的相关运行记录和日志按规定在规定时限内向空中交通管理机构报告"},{"id":313,"type":"多选题","stem":"飞前准备通常应确认哪些条件？","options":[{"key":"A","text":"仅确认灯光效果即可"},{"key":"B","text":"航空器及关键部件状态正常"},{"key":"C","text":"通信/定位等任务条件满足要求"},{"key":"D","text":"任务和飞行区域限制可以在起飞后补查"}],"answer":"BC","answerText":"航空器及关键部件状态正常通信/定位等任务条件满足要求"},{"id":314,"type":"多选题","stem":"关于电子围栏/空域保持能力，下列说法正确的有？","options":[{"key":"A","text":"可用于限制高度范围"},{"key":"B","text":"是降低越界风险的一种技术措施"},{"key":"C","text":"设置后可以取消所有现场监控"},{"key":"D","text":"可用于限制水平范围"}],"answer":"ABD","answerText":"可用于限制高度范围是降低越界风险的一种技术措施可用于限制水平范围"},{"id":315,"type":"多选题","stem":"提升指挥控制链路安全性的措施包括？","options Text":"错误"},{"id":455,"type":"判断题","stem":"受到酒精类饮料、麻醉剂或者其他药物影响时，不得操控无人驾驶航空器。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":456,"type":"判断题","stem":"《无人驾驶航空器飞行管理暂行条例》明确规定，无人驾驶航空器在室内飞行不适用该条例。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":457,"type":"判断题","stem":"飞行异常导致飞行安全问题时，只要无人机已安全降落，就无需再按规定报告。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":458,"type":"判断题","stem":"无人机无线电设备使用时应避免对合法无线电业务造成有害干扰。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":459,"type":"判断题","stem":"无人机绕机体纵轴的转动称为滚转。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":460,"type":"判断题","stem":"无人机偏航是绕机体横轴的转动。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":461,"type":"判断题","stem":"电调（ESC）的主要作用之一是根据控制信号调节无刷电机转速。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":462,"type":"判断题","stem":"多旋翼无人机稳定悬停时，竖直方向总推力通常与重力大致平衡。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":463,"type":"判断题","stem":"阵风可能造成短时间姿态和位置扰动增大。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":464,"type":"判断题","stem":"低温环境下一般会使锂电池可用容量和放电能力提高。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":465,"type":"判断题","stem":"通信丢包率越高，通常说明数据传输可靠性越好。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":466,"type":"判断题","stem":"IPv4地址可用于标识网络中的设备接口。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":467,"type":"判断题","stem":"三维直角坐标系通常用X、Y、Z三个坐标轴描述空间位置。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":468,"type":"判断题","stem":"损坏的锂电池可以与普通生活垃圾混放处理。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":469,"type":"判断题","stem":"群飞任务规划应先明确任务目标、约束和完成标准，再开展具体编排。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":470,"type":"判断题","stem":"设置“关键状态不满足则禁止起飞”属于一种安全联锁逻辑。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":471,"type":"判断题","stem":"三维队形只需要X、Y两个坐标，不需要高度信息。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":472,"type":"判断题","stem":"只要轨迹的最大速度未超限，就可以完全不考虑加速度约束。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":473,"type":"判断题","stem":"错开多架无人机通过同一狭窄区域的时间，可作为降低冲突风险的手段。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":474,"type":"判断题","stem":"群飞灯光效果若要与队形动作同步，需要关注统一时间基准。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":475,"type":"判断题","stem":"只要最终目标队形点位间距安全，就不必检查队形变换过程中的动态间距。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":476,"type":"判断题","stem":"分批起飞可用于降低起飞阶段局部空间冲突和瞬时系统压力。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":477,"type":"判断题","stem":"三维仿真可以帮助发现越界和轨迹冲突，但不能替代全部现场安全检查。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":478,"type":"判断题","stem":"如果碰撞检测通过，即使轨迹越出飞行边界，也可以直接执行任务。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":479,"type":"判断题","stem":"多机路径规划除固定障碍物外，还需考虑无人机之间的相互冲突。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":480,"type":"判断题","stem":"定位误差增大时，通常应缩小安全距离以保持队形紧凑。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":481,"type":"判断题","stem":"两条轨迹的二维投影相交，并不一定意味着两架无人机会发生碰撞。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":482,"type":"判断题","stem":"改变路径、改变通过时间或使用不同高度层，都可以作为规划层面的避碰手段。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":483,"type":"判断题","stem":"在保证其他条件相同的理想情况下，较短路径通常有助于减少飞行距离。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":484,"type":"判断题","stem":"路径最短就一定是最优路径，因此无需考虑安全裕度和可执行性。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":485,"type":"判断题","stem":"动态重规划生成的新路径仍需要重新进行边界、冲突和运动约束检查。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":486,"type":"判断题","stem":"使用离散航点规划时，只检查航点本身而不检查航点之间的航段，可能漏掉障碍物冲突。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":487,"type":"判断题","stem":"系统联调应确认地面站、无人机、通信和定位等模块能够协同工作。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":488,"type":"判断题","stem":"任务文件校验值与发布方不一致时，可以直接忽略，只要文件能打开即可。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":489,"type":"判断题","stem":"地面站三维仿真可用于飞前预览和发现越界、冲突等问题。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":490,"type":"判断题","stem":"多个告警同时出现时，应优先考虑对飞行安全影响较大的高等级告警。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":491,"type":"判断题","stem":"更换冗余机后，只要新机在线，就无需更新编号或任务映射。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":492,"type":"判断题","stem":"关键飞行参数修改后，应记录变更并重新进行必要的校验或仿真。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":493,"type":"判断题","stem":"集群状态监控应覆盖位置、速度、高度、电量、定位和通信等关键状态。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":494,"type":"判断题","stem":"某个参数出现一次异常尖峰，就一定能据此确定唯一故障原因。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":495,"type":"判断题","stem":"异常分级应考虑其对安全和任务的影响程度以及处置紧迫性。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":496,"type":"判断题","stem":"无人机进入降落阶段后即可停止状态监控，无需确认全部安全落地。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":497,"type":"判断题","stem":"飞行数据完整性核查应关注数据是否缺失、损坏或被非预期改变。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":498,"type":"判断题","stem":"实际轨迹与计划轨迹之间的空间差异可以作为轨迹偏差的一种表示。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"},{"id":499,"type":"判断题","stem":"只看平均轨迹偏差就一定不会漏掉任何短时严重偏差。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerText":"错误"},{"id":500,"type":"判断题","stem":"用于异常调查的原始日志应尽量保留，分析时可使用可追溯副本。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerText":"正确"}]</script>

<script>
(function(){
  'use strict';
  var RAW = JSON.parse(document.getElementById('questionData').textContent);
  var questions = [], cur = 0, answers = [], multiSel = {};

  /* ---- 工具 ---- */
  function $(id){ return document.getElementById(id); }
  function shuffle(a){
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function norm(s){ return s.split('').sort().join(''); }
  function show(id){
    $('startScreen').classList.add('hidden');
    $('quizScreen').classList.add('hidden');
    $('resultScreen').classList.add('hidden');
    $(id).classList.remove('hidden');
  }

  /* ---- 主题切换 ---- */
  function setTheme(t){
    document.body.setAttribute('data-theme', t);
    var btns = document.querySelectorAll('.theme-btn');
    for(var i = 0; i < btns.length; i++){
      btns[i].classList.toggle('active', btns[i].getAttribute('data-theme') === t);
    }
  }
  var themeBtns = document.querySelectorAll('.theme-btn');
  for(var bi = 0; bi < themeBtns.length; bi++){
    (function(btn){
      btn.addEventListener('click', function(){
        setTheme(btn.getAttribute('data-theme'));
      });
    })(themeBtns[bi]);
  }
  setTheme('navy');

  /* ---- 渲染 ---- */
  function render(){
    var q = questions[cur];
    $('qType').textContent = q.type;
    $('qNum').textContent = '第 ' + (cur + 1) + ' / ' + questions.length + ' 题';
    $('qStem').textContent = q.stem;
    var box = $('qOptions');
    box.innerHTML = '';
    var saved = answers[cur] || '';
    multiSel = {};
    for(var k = 0; k < saved.length; k++){ multiSel[saved.charAt(k)] = true; }
    q.options.forEach(function(o){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.innerHTML = '<span class="key">' + o.key + '</span><span>' + o.text + '</span>';
      if(multiSel[o.key]){ b.classList.add('sel'); }
      b.addEventListener('click', function(){ onOption(q, o, b); });
      box.appendChild(b);
    });
    updateNav();
    updateProgress();
  }

  function onOption(q, o, b){
    if(q.type === '多选题'){
      if(b.classList.contains('sel')){ b.classList.remove('sel'); delete multiSel[o.key]; }
      else{ b.classList.add('sel'); multiSel[o.key] = true; }
      updateNav();
      return;
    }
    var opts = document.querySelectorAll('#qOptions .opt');
    for(var i = 0; i < opts.length; i++){ opts[i].classList.remove('sel'); }
    b.classList.add('sel');
    answers[cur] = o.key;
    updateNav();
  }

  function updateNav(){
    $('prevBtn').classList.toggle('hidden', cur === 0);
    var answeredNow = !!answers[cur] || Object.keys(multiSel).length > 0;
    $('nextBtn').classList.toggle('hidden', !answeredNow);
  }

  function updateProgress(){
    var pct = Math.round((cur + 1) / questions.length * 100);
    $('progressFill').style.width = pct + '%';
    $('progressText').textContent = (cur + 1) + ' / ' + questions.length + ' · ' + pct + '%';
  }

  /* ---- 导航 ---- */
  function goNext(){
    var q = questions[cur];
    if(q.type === '多选题'){
      var keys = Object.keys(multiSel).sort();
      answers[cur] = keys.join('');
    }
    if(cur === questions.length - 1){ finish(); return; }
    cur++;
    render();
  }
  function goPrev(){
    if(cur > 0){ cur--; render(); }
  }
  function finish(){
    var correct = 0;
    for(var i = 0; i < questions.length; i++){
      var q = questions[i], a = answers[i] || '';
      if(!a){ continue; }
      if(q.type === '多选题'){
        if(norm(a) === norm(q.answer)){ correct++; }
      }else{
        if(a === q.answer){ correct++; }
      }
    }
    var wrong = questions.length - correct;
    var score = Math.round(correct / questions.length * 100);
    $('scoreNum').textContent = score;
    $('statCorrect').textContent = correct;
    $('statWrong').textContent = wrong;
    show('resultScreen');
  }

  function startQuiz(){
    questions = shuffle(RAW.slice());
    answers = new Array(questions.length).fill(null);
    cur = 0;
    show('quizScreen');
    render();
  }
  function showStart(){
    show('startScreen');
    var t = $('mainTitle');
    t.style.animation = 'none';
    void t.offsetWidth;
    t.style.animation = '';
  }

  $('startBtn').addEventListener('click', startQuiz);
  $('prevBtn').addEventListener('click', goPrev);
  $('nextBtn').addEventListener('click', goNext);
  $('restartBtn').addEventListener('click', showStart);
})();
</script>
</body>
</html>
